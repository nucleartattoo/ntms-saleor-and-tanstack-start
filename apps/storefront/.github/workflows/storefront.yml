name: Storefront

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  NODE_VERSION: 22.22.0
  SALEOR_API_ENDPOINT: https://ntms-saleor.kubernetes.nucleartattoosupply.com/graphql/
  SALEOR_CHANNEL: default-channel
  SALEOR_ROOT_CATEGORY_SLUG: __root__
  STOREFRONT_BACKEND: saleor
  COMPANY_NAME: Nuclear Tattoo Supply
  SITE_NAME: Nuclear Tattoo Supply
  WEBSITE_URL: https://saleor-ntms-tanstack.kubernetes.nucleartattoosupply.com
  APP_SERVICE_NAME: saleor-ntms-tanstack

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run typecheck
      - run: npm test -- --run
      - run: npm run build

  publish-image:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            SALEOR_API_ENDPOINT=${{ env.SALEOR_API_ENDPOINT }}
            SALEOR_CHANNEL=${{ env.SALEOR_CHANNEL }}
            SALEOR_ROOT_CATEGORY_SLUG=${{ env.SALEOR_ROOT_CATEGORY_SLUG }}
            VITE_STOREFRONT_BACKEND=${{ env.STOREFRONT_BACKEND }}
            VITE_COMPANY_NAME=${{ env.COMPANY_NAME }}
            VITE_SITE_NAME=${{ env.SITE_NAME }}
            VITE_TWITTER_CREATOR=@nucleartattoosupply
            VITE_TWITTER_SITE=@nucleartattoosupply
            VITE_PARENT_ID=1
            VITE_WEBSITE_URL=${{ env.WEBSITE_URL }}
            VITE_SEARCH_INDEXING=disabled
            VITE_APP_BUILD_VERSION=sha-${{ github.sha }}
            APP_SERVICE_NAME=${{ env.APP_SERVICE_NAME }}
          tags: |
            ghcr.io/ellistondow/saleor-ntms-tanstack:sha-${{ github.sha }}
            ghcr.io/ellistondow/saleor-ntms-tanstack:main
